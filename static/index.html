<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mercadeo Grupo Rapid</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7fb;--sf:#ffffff;--sf2:#f5f6f8;--ink:#323338;--mu:#676879;--ln:#e1e3ea;--ln2:#c3c6d4;
  --acc:#0073ea;--acc2:#cce5ff;--red:#e01f26;--hov:#dcdfec;--side:#ffffff;
  --shadow:0 6px 24px rgba(0,0,0,.12);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#181b34;--sf:#30324e;--sf2:#292b45;--ink:#d5d8df;--mu:#9699a6;--ln:#4b4e69;--ln2:#5b5e78;--acc:#579bfc;--acc2:#21305a;--hov:#3a3d5c;--side:#292b45;--shadow:0 6px 24px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#181b34;--sf:#30324e;--sf2:#292b45;--ink:#d5d8df;--mu:#9699a6;--ln:#4b4e69;--ln2:#5b5e78;--acc:#579bfc;--acc2:#21305a;--hov:#3a3d5c;--side:#292b45;--shadow:0 6px 24px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Figtree","Segoe UI",system-ui,-apple-system,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);height:100vh}
/* barra lateral */
.side{background:var(--side);border-right:1px solid var(--ln);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;font-weight:800;font-size:15px}
.brand i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#e01f26,#0b4ea2);display:grid;place-items:center;color:#fff;font-style:normal;font-size:13px}
.nav{overflow:auto;padding:4px 8px 12px;flex:1}
.nav h6{margin:14px 8px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.nav button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:none;border-radius:6px;padding:7px 10px;text-align:left}
.nav button:hover{background:var(--hov)}
.nav button.on{background:var(--acc2);color:var(--acc);font-weight:700}
.nav button .ct{margin-left:auto;font-size:11px;color:var(--mu)}
.side .foot{padding:10px 12px;border-top:1px solid var(--ln);display:grid;gap:6px}
.side .foot button{border:1px solid var(--ln);background:var(--sf);border-radius:6px;padding:6px 8px;font-size:12px;text-align:left}
/* principal */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{background:var(--sf);border-bottom:1px solid var(--ln);padding:14px 22px 0}
.top h1{margin:0;font-size:22px;display:flex;align-items:center;gap:10px}
.top .desc{color:var(--mu);margin:4px 0 0;max-width:90ch}
.tabs{display:flex;gap:2px;margin-top:10px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;border-bottom:2px solid transparent;white-space:nowrap;color:var(--mu)}
.tabs button.on{border-color:var(--acc);color:var(--ink);font-weight:700}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 22px;background:var(--sf);border-bottom:1px solid var(--ln)}
.bar .pri{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:7px 12px;font-weight:600}
.bar input[type=search]{border:1px solid var(--ln);background:var(--sf);border-radius:6px;padding:6px 10px;min-width:200px}
.chip{border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:4px 10px 4px 4px;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.chip.all{padding:4px 12px}
.chip[aria-pressed="true"]{border-color:var(--acc);background:var(--acc2);color:var(--acc);font-weight:700}
.tog{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mu)}
.content{flex:1;overflow:auto;padding:16px 22px 60px}
.empty{color:var(--mu);padding:30px;text-align:center;border:1px dashed var(--ln2);border-radius:10px}
/* avatar */
.av{width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;display:inline-grid;place-items:center;font:700 11px/1 system-ui;flex:none}
.av.none{background:transparent;border:1px dashed var(--ln2);color:var(--mu)}
/* grupos y tabla */
.grp{margin-bottom:26px}
.gh{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.gh .car{border:0;background:none;color:var(--gc);font-size:14px;width:22px}
.gh input{border:1px solid transparent;background:none;font-weight:700;font-size:17px;color:var(--gc);padding:2px 4px;border-radius:4px;min-width:60px}
.gh input:hover{border-color:var(--ln)}
.gh .n{color:var(--mu);font-size:13px}
.gh .gmenu{border:0;background:none;color:var(--mu);margin-left:auto;font-size:18px;line-height:1}
.tw{overflow-x:auto;border-radius:6px}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:900px;background:var(--sf)}
th,td{border-bottom:1px solid var(--ln);border-right:1px solid var(--ln);padding:0;height:38px;font-size:13.5px;vertical-align:middle}
th{font-weight:500;color:var(--mu);background:var(--sf);text-align:center;padding:0 8px;height:34px;white-space:nowrap}
th:first-child,td:first-child{border-left:6px solid var(--gc)}
td.name{min-width:300px;text-align:left}
.nm{display:flex;align-items:center;gap:6px;padding:0 8px;height:100%}
.nm input{flex:1;border:1px solid transparent;background:none;padding:5px 6px;border-radius:4px;min-width:0}
.nm input:hover{border-color:var(--ln)}
.nm input:focus{border-color:var(--acc);outline:0;background:var(--sf)}
.nm .sub{border:1px solid var(--ln);background:var(--sf);color:var(--mu);border-radius:4px;font-size:11px;padding:1px 5px;white-space:nowrap}
.nm .op{border:0;background:none;color:var(--mu);padding:3px 6px;border-radius:4px;opacity:.0}
tr:hover .nm .op{opacity:1}
.nm .op:hover{background:var(--hov);color:var(--acc)}
.nm .upd{color:var(--mu);font-size:12px;display:inline-flex;gap:2px;align-items:center}
tr.done .nm input{text-decoration:line-through;color:var(--mu)}
.cell{width:100%;height:100%;display:flex;align-items:center;justify-content:center;border:0;background:none;padding:0 6px}
.st{color:#fff;font-weight:500;background:var(--sc);height:100%;width:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;line-height:1.15;padding:0 6px}
.st:hover{filter:brightness(.95)}
.pp{display:flex;align-items:center;justify-content:center;gap:4px;height:100%}
input.dt{border:0;background:none;text-align:center;width:120px;padding:4px;border-radius:4px}
input.dt:hover{background:var(--hov)}
input.dt.late{color:#e2445c;font-weight:700}
input.dt.soon{color:#d97706;font-weight:700}
.tx{border:0;background:none;width:100%;padding:0 8px;height:100%}
.tx:hover{background:var(--hov)}
.lnk{color:var(--acc);font-size:12.5px;text-decoration:none;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;max-width:150px}
.tag{display:inline-block;border-radius:4px;padding:1px 7px;font-size:12px;background:var(--tc);color:#fff;white-space:nowrap}
.tl{position:relative;height:22px;width:150px;border-radius:999px;background:var(--ln);overflow:hidden;margin:auto}
.tl i{position:absolute;inset:0 auto 0 0;background:var(--gc)}
.tl span{position:relative;font-size:12px;color:#fff;font-weight:600;display:block;text-align:center;line-height:22px;mix-blend-mode:normal;text-shadow:0 0 3px rgba(0,0,0,.5)}
tr.addr td{height:36px}
tr.addr input{border:0;background:none;padding:0 14px;height:100%;width:100%}
tr.sumr td{border:0;background:transparent;height:32px}
.batt{display:flex;height:22px;border-radius:3px;overflow:hidden;margin:4px 6px;background:var(--ln)}
.batt i{display:block;height:100%}
tr.subrow td{background:var(--sf2)}
tr.subrow td:first-child{border-left-color:color-mix(in srgb,var(--gc) 45%,transparent)}
tr.subrow .nm{padding-left:34px}
tr.subhead td{background:var(--sf2);color:var(--mu);font-size:12px;height:28px;text-align:center}
tr.subhead td:first-child{text-align:left;padding-left:40px}
/* pop */
.pop{position:fixed;z-index:60;background:var(--sf);border:1px solid var(--ln);border-radius:8px;box-shadow:var(--shadow);padding:8px;display:grid;gap:4px;min-width:180px;max-height:70vh;overflow:auto}
.pop .o{border:0;color:#fff;border-radius:4px;padding:7px 10px;font-weight:600;text-align:center}
.pop .p{border:0;background:none;display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;text-align:left}
.pop .p:hover{background:var(--hov)}
.pop .t{font-size:11px;color:var(--mu);padding:4px 6px 0}
/* kanban */
.kb{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.kc{min-width:270px;width:270px;background:var(--sf2);border-radius:8px;display:flex;flex-direction:column;max-height:calc(100vh - 230px)}
.kc h4{margin:0;padding:10px 12px;color:#fff;background:var(--sc);border-radius:8px 8px 0 0;font-size:14px;display:flex;justify-content:space-between}
.kc .ks{overflow:auto;padding:8px;display:grid;gap:8px;min-height:60px}
.kc.over{outline:2px dashed var(--acc)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:10px;display:grid;gap:6px;cursor:grab}
.card b{font-weight:600}
.card .meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mu);flex-wrap:wrap}
/* calendario */
.calh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.calh b{font-size:18px;min-width:180px}
.calh button{border:1px solid var(--ln);background:var(--sf);border-radius:6px;padding:5px 10px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--ln);border-left:1px solid var(--ln);background:var(--sf)}
.cal .dw{padding:6px;font-size:12px;color:var(--mu);text-align:center;border-right:1px solid var(--ln);border-bottom:1px solid var(--ln)}
.cal .dd{min-height:112px;border-right:1px solid var(--ln);border-bottom:1px solid var(--ln);padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .dd.out{background:var(--sf2);opacity:.6}
.cal .dd.today{box-shadow:inset 0 0 0 2px var(--acc)}
.cal .dn{font-size:12px;color:var(--mu);font-weight:600}
.ev{border:0;text-align:left;border-radius:4px;padding:2px 6px;font-size:11.5px;color:#fff;background:var(--sc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:4px;align-items:center}
.ev .av{width:16px;height:16px;font-size:9px}
.more{font-size:11px;color:var(--mu);border:0;background:none;text-align:left}
/* cronograma */
.gt{background:var(--sf);border:1px solid var(--ln);border-radius:8px;overflow:auto}
.gtg{display:grid;min-width:900px}
.gtg .hd{position:sticky;top:0;background:var(--sf);z-index:1;font-size:11px;color:var(--mu);text-align:center;border-bottom:1px solid var(--ln);padding:4px 0}
.gtg .hd.mo{font-weight:700;color:var(--ink);text-align:left;padding-left:6px}
.gtg .lb{padding:5px 10px;border-bottom:1px solid var(--ln);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;display:flex;gap:6px;align-items:center;background:var(--sf)}
.gtg .rw{border-bottom:1px solid var(--ln);position:relative}
.gtg .bx{position:absolute;top:6px;bottom:6px;border-radius:999px;background:var(--sc);color:#fff;font-size:11px;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;border:0}
.gtg .todayl{position:absolute;top:0;bottom:0;width:2px;background:#e2445c;z-index:2}
/* panel lateral (elemento) */
.dr{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--sf);box-shadow:var(--shadow);z-index:50;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s}
.dr.on{transform:none}
.drh{display:flex;align-items:flex-start;gap:10px;padding:16px 18px;border-bottom:1px solid var(--ln)}
.drh textarea{flex:1;border:1px solid transparent;background:none;font-size:20px;font-weight:700;resize:none;padding:4px;border-radius:6px}
.drh textarea:hover{border-color:var(--ln)}
.drh .x{border:0;background:none;font-size:24px;color:var(--mu)}
.drb{overflow:auto;padding:14px 18px 40px;display:grid;gap:16px;align-content:start}
.fields{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;align-items:center}
.fields label{color:var(--mu);font-size:13px}
.fields .st{height:32px;border-radius:4px;max-width:220px;cursor:pointer;border:0}
.fields input,.fields select,.fields textarea{border:1px solid var(--ln);background:var(--sf);border-radius:6px;padding:6px 8px;width:100%}
.dsec h4{margin:0 0 8px;font-size:14px}
.dsec table{min-width:0}
.upd-in{display:grid;gap:6px}
.upd-in textarea{border:1px solid var(--ln);border-radius:8px;padding:8px;min-height:70px;background:var(--sf)}
.upd-in .rw{display:flex;gap:8px;align-items:center}
.ul{display:grid;gap:8px}
.u{border:1px solid var(--ln);border-radius:8px;padding:8px 10px;display:grid;gap:4px}
.u .m{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mu)}
.u .m .del{margin-left:auto;border:0;background:none;color:var(--mu)}
.u p{margin:0;white-space:pre-wrap}
.btn{border:1px solid var(--ln);background:var(--sf);border-radius:6px;padding:6px 10px;font-size:13px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.dan{color:#e2445c}
.rowb{display:flex;gap:8px;flex-wrap:wrap}
.gcal{display:inline-flex;align-items:center;gap:6px;color:var(--acc);text-decoration:none;font-size:13px}
/* mi trabajo y calendarios */
.mw{display:grid;gap:18px}
.mws h3{margin:0 0 8px;font-size:16px;display:flex;gap:8px;align-items:center}
.mwl{background:var(--sf);border:1px solid var(--ln);border-radius:8px}
.mwi{display:grid;grid-template-columns:minmax(0,1fr) 140px 160px 110px;gap:8px;align-items:center;border-bottom:1px solid var(--ln);padding:0 0 0 12px;min-height:40px}
.mwi:last-child{border-bottom:0}
.mwi .t{border:0;background:none;text-align:left;padding:8px 0}
.mwi .t small{display:block;color:var(--mu);font-size:12px}
.mwi .st{height:40px}
.cals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.cbox{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px;display:grid;gap:10px;align-content:start}
.cbox h3{margin:0;display:flex;gap:8px;align-items:center}
.cbox iframe{width:100%;height:520px;border:1px solid var(--ln);border-radius:8px;background:#fff}
.cbox .ph{height:200px;border:1px dashed var(--ln2);border-radius:8px;display:grid;place-items:center;color:var(--mu);text-align:center;padding:16px}
.cbox .cfg{display:flex;gap:6px}
.cbox .cfg input{flex:1;border:1px solid var(--ln);border-radius:6px;padding:6px 8px;background:var(--sf)}
.cbox ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;max-height:300px;overflow:auto}
.cbox li{display:flex;gap:8px;align-items:center;font-size:13px;border-bottom:1px solid var(--ln);padding:4px 0}
.cbox li .d{color:var(--mu);width:70px;flex:none}
.cbox li .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#323338;color:#fff;padding:8px 16px;border-radius:999px;z-index:90;font-size:13px}
.mob{display:none}
.guia{display:flex;flex-wrap:wrap;gap:6px 16px;background:var(--acc2);border-radius:10px;padding:10px 14px;font-size:13.5px}
.sync{font-size:12px;color:var(--mu);padding:2px 4px}.sync.err{color:#e2445c}
.login{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;padding:16px}
.login form{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:28px;display:grid;gap:12px;width:min(360px,100%);box-shadow:var(--shadow)}
.login h2{margin:0;font-size:20px}.login p{margin:0;color:var(--mu);font-size:13px}
.login input{border:1px solid var(--ln);border-radius:8px;padding:10px;background:var(--sf)}
.login button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px;font-weight:700}
.login .e{color:#e2445c;font-size:13px;min-height:1em}
.sp{display:grid;gap:18px}
.sph{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sph b{font-size:18px;min-width:220px}
.sph button{border:1px solid var(--ln);background:var(--sf);border-radius:6px;padding:5px 10px}
.prog{height:10px;border-radius:999px;background:var(--ln);overflow:hidden;flex:1;min-width:160px;max-width:360px}.prog i{display:block;height:100%;background:#00c875}
.ck{background:var(--sf);border:1px solid var(--ln);border-radius:10px}
.ck h3{margin:0;padding:10px 14px;border-bottom:1px solid var(--ln);font-size:15px;display:flex;gap:8px;align-items:center}
.cki{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--ln)}
.cki:last-child{border-bottom:0}
.cki input[type=checkbox]{width:20px;height:20px;accent-color:#00c875;flex:none}
.cki .t{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0}
.cki .t small{display:block;color:var(--mu);font-size:12px}
.cki.ok .t>span{text-decoration:line-through;color:var(--mu)}
.cki .late{color:#e2445c;font-size:12px;font-weight:700;white-space:nowrap}
.cki .del{border:0;background:none;color:var(--mu)}
.wk{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px;overflow-x:auto}
.wkd{background:var(--sf);border:1px solid var(--ln);border-radius:8px;min-height:120px;display:flex;flex-direction:column}
.wkd h4{margin:0;padding:6px 8px;font-size:12.5px;border-bottom:1px solid var(--ln);display:flex;justify-content:space-between}
.wkd.today{box-shadow:inset 0 0 0 2px var(--acc)}
.wkd button{border:0;background:none;text-align:left;font-size:12px;padding:5px 8px;border-bottom:1px solid var(--ln);display:flex;gap:6px;align-items:flex-start}
.wkd button i{width:8px;height:8px;border-radius:50%;background:var(--sc);flex:none;margin-top:4px}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.sub2{display:flex;gap:6px;margin:8px 14px 12px}.sub2 input{flex:1;border:1px solid var(--ln);border-radius:6px;padding:6px 8px;background:var(--sf)}
.calk{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.calk code{font-size:11px;background:var(--sf2);border:1px solid var(--ln);border-radius:6px;padding:4px 6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .mob{display:flex;gap:8px;padding:10px 14px;background:var(--sf);border-bottom:1px solid var(--ln)}
  .mob select{flex:1;border:1px solid var(--ln);border-radius:6px;padding:6px;background:var(--sf)}
  .top,.bar,.content{padding-left:14px;padding-right:14px}
  .cals{grid-template-columns:1fr}
  .mwi{grid-template-columns:minmax(0,1fr) 110px}
  .mwi .hm{display:none}
  .fields{grid-template-columns:1fr}
}
/* === Estilo monday.com (6 nov 2026) === */
:root{--bg:#f6f7fb;--ln:#e6e9ef;--ln2:#d0d4e4;--ink:#323338;--mu:#676879;--acc:#0073ea;--acc2:#cce5ff}
body{font-family:"Figtree","Roboto","Segoe UI",system-ui,sans-serif;font-size:14px}
.top{padding:18px 32px 0}
.top h1{font-size:24px;font-weight:600}
.bar{padding:10px 32px}
.content{padding:20px 32px 60px;background:var(--sf)}
.bar .pri{border-radius:4px;padding:8px 14px;font-weight:500}
.bar .pri:hover{background:#0060b9}
.chip{border-radius:4px}
.tabs button{padding:8px 14px;font-weight:500}
/* grupos */
.grp{margin-bottom:34px}
.gh{margin-bottom:8px}
.gh input{font-size:18px;font-weight:600}
.tw{border-radius:0}
table{border-spacing:0;min-width:980px}
th{font-weight:400;color:var(--mu);font-size:14px;height:36px;border-top:1px solid var(--ln)}
th,td{border-color:var(--ln)}
td{height:36px;background:var(--sf)}
th:first-child,td:first-child{border-left-width:6px;border-radius:0}
tbody tr:hover td{background:#f5f6f8}
tbody tr:hover td .st{filter:none}
.nm input{font-size:14px}
/* celdas de estado y prioridad: color completo, sin bordes, como Monday */
.st,button.st,.cell .st{border:0!important;outline:0;box-shadow:none;border-radius:0;color:#fff;font-weight:400;font-size:14px;letter-spacing:.1px;margin:0}
td:has(> .st), td:has(> .cell > .st){padding:0;border-right:1px solid #fff}
.st:hover{filter:brightness(1.06)}
.cell{padding:0}
/* fechas */
input.dt{font-size:14px;color:var(--ink)}
/* cronograma: barra del color del grupo */
.tl{height:24px;width:160px;border-radius:12px;background:color-mix(in srgb,var(--gc) 45%,#ffffff)}
.tl i{background:var(--gc)}
.tl span{font-size:12.5px;font-weight:500;line-height:24px;text-shadow:none}
/* fila de resumen (batería de estados) */
.batt{height:24px;border-radius:0;margin:6px 8px}
/* etiquetas */
.tag{border-radius:3px;padding:2px 8px;font-size:13px}
/* barra lateral */
.side{background:#fff}
.nav button{border-radius:4px;padding:7px 12px}
.nav button.on{background:#cce5ff;color:#0073ea}

/* archivos */
.fls{display:flex;align-items:center;gap:4px;padding:0 6px;min-height:34px;overflow:hidden}
.fls.on{outline:2px dashed var(--acc);outline-offset:-3px}
.fl{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--ln);border-radius:4px;padding:1px 6px 1px 2px;font-size:12px;max-width:110px;color:var(--ink);text-decoration:none;background:var(--sf);flex:none}
.fl:hover{border-color:var(--acc)}
.fl img{width:24px;height:24px;object-fit:cover;border-radius:3px;display:block}
.fl .fi{font-size:16px;line-height:24px;width:22px;text-align:center}
.fl .fn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl.big{max-width:220px;padding:3px 8px 3px 3px}
.fl.big img{width:40px;height:40px}
.fmore{font-size:12px;color:var(--mu)}
.fadd{margin-left:auto;border:1px dashed var(--ln2);background:transparent;color:var(--mu);border-radius:4px;width:24px;height:24px;cursor:pointer;flex:none;font-size:15px;line-height:1}
.fadd:hover{border-color:var(--acc);color:var(--acc)}
.frow{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid var(--ln)}
.frow .fnm{flex:1;min-width:0}
.fdrop{display:flex;align-items:center;gap:8px;border:1px dashed var(--ln2);border-radius:6px;padding:10px;margin-top:8px}
.fdrop.on{border-color:var(--acc);background:var(--acc2)}
.fup{border:0;background:var(--acc);color:#fff;border-radius:4px;padding:7px 12px;cursor:pointer;font:inherit}
.flink{display:flex;gap:6px;margin-top:8px}.flink .tx{flex:1;border:1px solid var(--ln);border-radius:4px;padding:6px}
.pop:has(.fdrop){width:340px;max-width:calc(100vw - 24px)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#323338;color:#fff;padding:10px 16px;border-radius:6px;z-index:99;font-size:14px;max-width:90vw}
td.name{min-width:380px;width:380px}
.nm input{min-width:0;flex:1}

/* Mi día · To Do */
.nm .op.todo{white-space:nowrap;font-size:12.5px}
.nm .op.todo.on{opacity:1;color:#d97706;font-weight:600}
.tdp{padding:8px 0;border-bottom:1px solid var(--ln)}
.tdn{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.tdb{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tdb .btn.sel{background:#fff3cd;border-color:#fdab3d}
.tdb input.dt{border:1px solid var(--ln);border-radius:4px;padding:4px 6px;width:140px}
.pop:has(.tdp){width:360px;max-width:calc(100vw - 24px)}
.ras{display:inline-flex;gap:2px;margin-left:2px;flex:none}
.ra{border:0;background:none;color:var(--mu);padding:3px 5px;border-radius:4px;cursor:pointer;font-size:13px;text-decoration:none;opacity:.55;line-height:1.2}
tr:hover .ra{opacity:1}.ra:hover{background:var(--ln)}
.ra.del:hover{color:#e2445c}.ra.sure{opacity:1;background:#e2445c;color:#fff!important;font-size:12px;font-weight:600}
.ra.addp{opacity:1;color:var(--acc);font-weight:600;font-size:12.5px;border:1px solid var(--acc2);background:#f0f7ff;white-space:nowrap}
.ra.addp:hover{background:var(--acc);color:#fff}
.ra.inp{opacity:1;color:#00a35c;font-size:12.5px;white-space:nowrap}
.cki .pass{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--ln);background:var(--sf);border-radius:14px;padding:2px 10px 2px 3px;font-size:12.5px;color:var(--ink);cursor:pointer;white-space:nowrap;flex:none}
.cki .pass:hover{border-color:var(--acc);color:var(--acc)}
.cki .pass .av{width:20px;height:20px;font-size:10px}
.qsel{border:1px solid var(--ln);border-radius:4px;padding:6px;font:inherit;background:var(--sf);color:var(--ink)}

/* ===== rediseño Todo lo pendiente y Mi día ===== */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.tile{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto auto;column-gap:12px;align-items:center;text-align:left;border:0;border-radius:12px;padding:14px 16px;color:#fff;cursor:pointer;font:inherit;box-shadow:0 1px 3px rgba(0,0,0,.08);transition:transform .12s}
.tile:hover{transform:translateY(-2px)}.tile.on{outline:3px solid var(--ink);outline-offset:2px}
.tile .ti{grid-row:1/4;font-size:26px;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center}
.tile b{font-size:28px;line-height:1.1}.tile .tl2{font-weight:600;font-size:14px}.tile small{opacity:.85;font-size:12px}
.tile.late{background:linear-gradient(135deg,#e2445c,#f0657a)}.tile.today{background:linear-gradient(135deg,#f59e0b,#fdab3d)}
.tile.week{background:linear-gradient(135deg,#0073ea,#579bfc)}.tile.later{background:linear-gradient(135deg,#676879,#9699a6)}
.hfnote{display:flex;gap:10px;align-items:center;margin:-6px 0 14px;color:var(--mu);font-size:13px}
.pcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start}
.pcol{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;border-top:5px solid var(--pc)}
.pch{display:flex;align-items:center;gap:10px;margin-bottom:10px}.pch .av{width:40px;height:40px;font-size:16px}
.pch b{display:block;font-size:17px}.pch small{color:var(--mu);font-size:12.5px}.pch .btn{margin-left:auto}
.btn.sm{padding:4px 10px;font-size:12.5px}
.stk{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--ln);margin-bottom:12px;gap:2px}
.stk i.late{background:#e2445c}.stk i.today{background:#fdab3d}.stk i.week{background:#579bfc}.stk i.later{background:#c4c4c4}
.psec{margin-top:10px}.psec h4{margin:0 0 6px;font-size:13px;display:flex;justify-content:space-between;align-items:center;color:var(--mu);text-transform:uppercase;letter-spacing:.4px}
.psec.late h4{color:#e2445c}.psec.today h4{color:#d97706}.psec.week h4{color:#0073ea}
.pn{background:var(--ln);color:var(--ink);border-radius:99px;font-size:12px;padding:1px 9px;font-weight:600;text-transform:none;letter-spacing:0}
.tcard{display:flex;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--ln);border-left:5px solid var(--gc);border-radius:10px;padding:8px 10px;margin-bottom:6px;transition:box-shadow .12s}
.tcard:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.tcard .tt{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0;cursor:pointer;color:var(--ink);font:inherit}
.tcard .tt b{display:block;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard .tt small{display:block;color:var(--mu);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard.ok .tt b{text-decoration:line-through;color:var(--mu)}.tcard.ok{opacity:.7}
.tck{position:relative;flex:none;width:24px;height:24px;cursor:pointer}
.tck input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.tck i{position:absolute;inset:0;border:2px solid #c3c6d4;border-radius:50%;transition:all .15s}
.tck:hover i{border-color:#00c875}
.tck input:checked+i{background:#00c875;border-color:#00c875}
.tck input:checked+i::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.dch{flex:none;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.dch.late{background:#fde7ea;color:#d1293f}.dch.today{background:#fff1d6;color:#b45309}.dch.week{background:#e3efff;color:#0060b9}
.dch.later,.dch.none{background:var(--ln);color:var(--mu)}.dch.ok{background:#dcfce7;color:#008a49}
.more{border:0;background:none;color:var(--acc);font:inherit;font-size:13px;cursor:pointer;padding:4px 2px}
.empty2{padding:18px;text-align:center;color:var(--mu);font-size:14px}
.hero{display:flex;align-items:center;gap:20px;border-radius:16px;padding:20px 24px;color:#fff;background:linear-gradient(135deg,var(--pc),color-mix(in srgb,var(--pc) 55%,#1b1d22))}
.hl{flex:1;min-width:0}.hg{font-size:24px;font-weight:700}
.hd{display:flex;align-items:center;gap:8px;margin:6px 0 12px}.hd b{font-size:15px;font-weight:500;opacity:.95}
.hd button{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit}
.hd button:hover{background:rgba(255,255,255,.32)}
.hs{display:flex;gap:8px;flex-wrap:wrap}.hsc{background:rgba(255,255,255,.18);border-radius:10px;padding:6px 12px;font-size:12.5px;display:flex;gap:6px;align-items:baseline}
.hsc b{font-size:20px}.hsc.red{background:#fff;color:#d1293f}
.hr{display:grid;justify-items:center;gap:4px}.ring{width:92px;height:92px}.hr small{opacity:.9}
.tip{font-size:12.5px}
.ck.day,.ck.lt{border:0;background:none}.ck.day h3,.ck.lt h3{border:0;padding:0 2px 8px;font-size:16px;justify-content:flex-start}
.ck.lt h3{color:#e2445c}.ck .tcard{margin-bottom:8px}
.cki.tcard{border-bottom:1px solid var(--ln)}.cki.tcard.islate{background:#fff8f8}
.cki.tcard .del{border:0;background:none;color:var(--mu);cursor:pointer;font-size:14px}
.cki .pass{gap:5px}
.two>div{min-width:0;grid-template-columns:minmax(0,1fr)}.ck{min-width:0}.cki.tcard{min-width:0}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{flex-direction:column;align-items:flex-start}}
/* nombres completos, en varias líneas */
textarea.wta{flex:1;min-width:0;width:100%;resize:none;overflow:hidden;border:1px solid transparent;background:none;padding:6px;border-radius:4px;font:inherit;font-size:14px;line-height:1.35;color:var(--ink);white-space:pre-wrap;word-break:break-word;display:block}
textarea.wta:hover{border-color:var(--ln)}textarea.wta:focus{border-color:var(--acc);outline:0;background:var(--sf)}
textarea.wta.tx{font-size:13px;padding:6px 8px}
tr.done textarea.wta{text-decoration:line-through;color:var(--mu)}
td{height:auto!important;vertical-align:middle}
.nm{position:relative;height:auto;min-height:36px;padding:2px 8px}
.nm .acts{position:absolute;right:4px;top:50%;transform:translateY(-50%);display:flex;gap:2px;align-items:center;background:var(--sf);border-radius:6px;box-shadow:-10px 0 10px var(--sf);padding:2px;opacity:0;pointer-events:none;transition:opacity .12s}
tr:hover .nm .acts,.nm .acts:focus-within{opacity:1;pointer-events:auto}
.nm .acts .op{opacity:1}
.nm:has(.todo.on) .acts,.nm:has(.ra.inp) .acts{opacity:1;pointer-events:auto;position:static;transform:none;box-shadow:none;background:none}
tbody tr:hover .nm .acts{background:#f5f6f8;box-shadow:-10px 0 10px #f5f6f8}
.st{white-space:normal;line-height:1.2;padding:4px 6px}

/* comentarios */
.ccell{display:flex;align-items:center;gap:6px;width:100%;min-height:34px;border:0;background:none;text-align:left;padding:4px 8px;cursor:pointer;font:inherit;color:var(--mu)}
.ccell:hover{background:var(--ln)}.ccell .cic{flex:none;font-size:13px}
.ccell .ctx{font-size:12.5px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal}
.ccell.unread{color:var(--ink);font-weight:600}.ccell.unread .cic::after{content:" •";color:#e2445c}
.pop:has(.cwrap){width:420px;max-width:calc(100vw - 24px);max-height:70vh;overflow:auto}
.cth{display:grid;gap:8px;margin:6px 0}
.cmt{background:var(--bg);border-radius:8px;padding:8px 10px}.cmt.mine{background:#eaf3ff}
.cmt p{margin:4px 0 0;white-space:pre-wrap;font-size:13.5px}.cmh{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px}.cmh .av{width:20px;height:20px;font-size:10px}
.cnew textarea.cin{width:100%;border:1px solid var(--ln);border-radius:6px;padding:8px;font:inherit;font-size:13.5px;resize:vertical;background:var(--sf);color:var(--ink)}
.crow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.cto{display:inline-flex;gap:4px;align-items:center;font-size:12.5px}.cto .av{width:18px;height:18px;font-size:9px}
.crow .btn.pri{margin-left:auto}
.whoami{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 10px;font-size:12.5px}
.whoami .btn{display:inline-flex;gap:4px;align-items:center}.whoami .av{width:18px;height:18px;font-size:9px}
.lnkb{border:0;background:none;color:var(--acc);cursor:pointer;font:inherit;font-size:12.5px;padding:0}
.inbox{display:grid;gap:8px;max-width:900px}
.inb{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:10px 12px;cursor:pointer;font:inherit;color:var(--ink)}
.inb.new{border-left:4px solid #e2445c;background:#fff8f8}.inb .ib{flex:1;min-width:0}.inb p{margin:4px 0 0;white-space:pre-wrap}
.bar2{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}

/* filtros y borrar grupo */
.fbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;width:100%;margin-top:6px}
.fsel{border:1px solid var(--ln);border-radius:4px;padding:6px 8px;font:inherit;font-size:13px;background:var(--sf);color:var(--ink);max-width:220px}
.fsel.on{border-color:var(--acc);background:#eaf3ff;color:var(--acc);font-weight:600}
.gdel{border:0;background:none;color:var(--mu);cursor:pointer;padding:4px 8px;border-radius:4px;font:inherit;font-size:13px;opacity:.5}
.gh:hover .gdel{opacity:1}.gdel:hover{background:var(--ln)}
.gdel.sure{opacity:1;background:#e2445c;color:#fff;font-weight:600}

/* usuarios */
.lusers{display:flex;gap:10px;justify-content:center;margin:4px 0 8px}
.luser{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid var(--ln);background:var(--sf);border-radius:12px;padding:12px 18px;cursor:pointer;font:inherit;color:var(--ink);min-width:110px}
.login .luser{background:var(--sf)!important;color:var(--ink)!important;border:2px solid var(--ln)!important;width:auto;padding:12px 18px}.luser .av{width:44px;height:44px;font-size:18px}.login .luser.on{border-color:var(--acc)!important;background:#eaf3ff!important}
.whoami.ok{gap:8px}.whoami.ok .av{width:22px;height:22px;font-size:10px}
.cme{display:inline-flex;gap:5px;align-items:center;font-size:12.5px;font-weight:600}.cme .av{width:20px;height:20px;font-size:10px}

/* promociones: resumen */
.pr-season{border-radius:14px;padding:18px 22px;color:#fff;margin:0 0 16px;background:linear-gradient(120deg,var(--sc),color-mix(in srgb,var(--sc) 55%,#000))}
.pr-season small{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;font-weight:700}
.pr-season b{display:block;font-size:24px;margin:4px 0 2px}
.pr-season span{font-size:14px;opacity:.95}
.pr-next{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 20px}
.pr-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--ink)}
.pr-chip i{width:9px;height:9px;border-radius:50%;background:var(--sc);display:inline-block}
.pr-chip.on{border-color:var(--sc);box-shadow:0 0 0 2px color-mix(in srgb,var(--sc) 30%,transparent)}
.pr-h{display:flex;align-items:baseline;gap:10px;margin:8px 0 10px}
.pr-h h3{margin:0;font-size:17px}.pr-h span{color:var(--mu);font-size:13px}
.pr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin:0 0 24px}
.pr-card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;background:var(--sf);border:1px solid var(--ln);border-left:5px solid var(--sc);border-radius:10px;padding:12px 14px;color:var(--ink)}
.pr-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.08)}
.pr-card .t{font-weight:700;font-size:15px;line-height:1.3}
.pr-card .o{font-size:13.5px}
.pr-card .m{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--mu)}
.pr-st{color:#fff;border-radius:4px;padding:2px 8px;font-size:11.5px;font-weight:600;background:var(--stc)}
.pr-bar{height:6px;border-radius:3px;background:var(--ln);overflow:hidden}.pr-bar i{display:block;height:100%;background:var(--sc)}
.pr-cd{font-weight:700;color:var(--ink)}
.pr-gh{display:flex;align-items:center;gap:8px;margin:6px 0 8px;font-size:14px}.pr-gh i{width:12px;height:12px;border-radius:3px;background:var(--sc)}.pr-gh span{color:var(--mu);font-size:12.5px}
.pr-empty{color:var(--mu);border:1px dashed var(--ln2);border-radius:10px;padding:16px;text-align:center;margin:0 0 24px}
/* avisos */
.alerts{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.al{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font:inherit;text-align:left;max-width:360px;color:#fff}
.al b{font-size:14px;font-weight:600}.al span{font-size:12.5px;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:330px}
.al.late{background:#e2445c}.al.hoy{background:#fdab3d}.al.sem{background:#579bfc}
.al:hover{filter:brightness(1.06)}
/* compacto: más espacio para el tablero */
.top{padding:10px 24px 0}
.top h1{font-size:20px}
.top .desc{font-size:13px;margin:2px 0 0;max-width:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.top .desc.open{white-space:normal}
.tabs{margin-top:4px}.tabs button{padding:6px 12px}
.bar{padding:6px 24px;gap:6px}
.bar .pri{padding:6px 12px}
.bar input[type=search]{min-width:160px;padding:5px 10px}
.fbar{width:auto;margin-top:0}
.content{padding:10px 24px 40px}
.st{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbt{float:left;margin:0 10px 0 0;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:6px;padding:1px 8px;font-size:15px;line-height:24px;cursor:pointer}
.app.nosb{grid-template-columns:minmax(0,1fr)}.app.nosb .side{display:none}
@media (max-width:900px){.sbt{display:none}}

/* master: todo lo que está pasando */
.m-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:0 0 14px}
.m-card{all:unset;box-sizing:border-box;cursor:pointer;border-radius:10px;padding:10px 14px;color:#fff;background:var(--sc)}
.m-card b{display:block;font-size:24px;line-height:1.1}.m-card span{font-size:12.5px;opacity:.95}
.m-chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.m-chip{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--ink)}
.m-chip i{width:9px;height:9px;border-radius:50%;background:var(--bc)}.m-chip.off{opacity:.4;text-decoration:line-through}
.m-day{margin:0 0 12px}.m-day h4{margin:0 0 6px;font-size:14px;display:flex;gap:8px;align-items:baseline}.m-day h4 span{color:var(--mu);font-weight:400;font-size:12.5px}
