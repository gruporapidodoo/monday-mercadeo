<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drive de Mercadeo · Grupo Rapid</title>
<style>
:root{--bg:#f6f7f9;--sf:#fff;--ink:#1f1f1f;--mu:#5f6368;--ln:#e3e5e8;--hov:#eef2f7;--sel:#e8f0fe;--acc:#1a73e8;--red:#e01f26;--ok:#188038;--warn:#b06000}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1c1f;--sf:#232428;--ink:#e8eaed;--mu:#9aa0a6;--ln:#3a3c40;--hov:#2c2e33;--sel:#26344d;--acc:#8ab4f8}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:270px minmax(0,1fr);height:100vh}
.side{background:var(--sf);border-right:1px solid var(--ln);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;gap:10px;align-items:center;padding:16px;font-weight:800;font-size:16px}
.brand i{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#e01f26,#0b4ea2);color:#fff;display:grid;place-items:center;font-style:normal;font-size:13px}
.tree{overflow:auto;padding:4px 8px 16px;flex:1}
.tree button{display:flex;gap:8px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:6px 10px;border-radius:999px;font-size:13.5px}
.tree button:hover{background:var(--hov)}.tree button.on{background:var(--sel);font-weight:700}
.tree .sub{padding-left:22px}
.side .lk{padding:10px 14px;border-top:1px solid var(--ln);display:grid;gap:6px;font-size:13px}.side .lk a{color:var(--acc);text-decoration:none}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;gap:10px;align-items:center;padding:12px 20px;background:var(--sf);border-bottom:1px solid var(--ln);flex-wrap:wrap}
.crumb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:18px;flex:1;min-width:0}
.crumb button{border:0;background:none;padding:4px 8px;border-radius:8px}.crumb button:hover{background:var(--hov)}.crumb span{color:var(--mu)}
.top input{border:1px solid var(--ln);background:var(--bg);border-radius:999px;padding:8px 14px;min-width:240px}
.content{overflow:auto;padding:18px 20px 60px;flex:1}
h4{margin:6px 0 10px;font-size:13px;color:var(--mu);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:22px}
.fold{display:flex;gap:10px;align-items:center;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;text-align:left;min-width:0}
.fold:hover{background:var(--hov)}.fold b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}.fold small{color:var(--mu);font-size:12px}
.fold .ic{font-size:22px;flex:none}.fold .tx{min-width:0;flex:1}
.file{background:var(--sf);border:1px solid var(--ln);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0}
.file:hover{box-shadow:0 2px 10px rgba(0,0,0,.12)}
.file .th{aspect-ratio:4/5;background:#000;display:grid;place-items:center;overflow:hidden;position:relative}
.file .th img,.file .th video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.file .th .tag{position:absolute;left:8px;top:8px;font-size:11px;font-weight:700;color:#fff;border-radius:6px;padding:2px 7px;background:#5f6368}
.tag.vieja{background:#5f6368}.tag.nueva{background:var(--acc)}.tag.ok{background:var(--ok)}.tag.rev{background:#8430ce}.tag.cambios{background:var(--red)}
.file .ft{padding:9px 12px;display:grid;gap:2px}.file .ft b{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file .ft small{color:var(--mu);font-size:12px}
.empty{color:var(--mu);border:1px dashed var(--ln);border-radius:12px;padding:24px;text-align:center}
.pv{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;z-index:50;padding:16px;grid-template-rows:auto 1fr;gap:10px}.pv.on{display:grid}
.pvh{display:flex;gap:10px;align-items:center;color:#fff;flex-wrap:wrap}.pvh b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pvh a,.pvh button{color:#fff;background:rgba(255,255,255,.14);border:0;border-radius:8px;padding:7px 12px;text-decoration:none;font-weight:600}
.pvb{display:grid;place-items:center;min-height:0}.pvb img,.pvb video{max-width:100%;max-height:calc(100vh - 90px);border-radius:8px;background:#000}
.mob{display:none}
@media (max-width:820px){.app{grid-template-columns:1fr}.side{display:none}.mob{display:block}.top input{min-width:0;flex:1}}
</style></head>
<body>
<div class="app">
  <aside class="side"><div class="brand"><i>GR</i>Drive de Mercadeo</div><nav class="tree" id="tree"></nav>
    <div class="lk"><a href="/anuncios">🎬 Ir a la revisión (aprobar / feedback)</a><a href="/">✅ Ir al Monday</a></div></aside>
  <main class="main">
    <div class="top"><div class="crumb" id="crumb"></div><input type="search" id="q" placeholder="Buscar en el Drive"></div>
    <div class="content" id="content"><div class="empty">Cargando…</div></div>
  </main>
</div>
<div class="pv" id="pv"><div class="pvh"><b id="pvt"></b><a id="pvd" href="#">⬇ Descargar</a><button id="pvx">✕ Cerrar</button></div><div class="pvb" id="pvb"></div></div>
<script>
(function(){
var ITEMS=[],DOCS=[],Q="",EST={pend:"Pendiente",rev:"Por aprobar",cambios:"Cambios pendientes",ok:"Aprobado"};
function $(s){return document.querySelector(s)}
function el(t,a,txt){var e=document.createElement(t);if(a)for(var k in a){if(k==="on")for(var ev in a.on)e.addEventListener(ev,a.on[ev]);else e.setAttribute(k,a[k])}if(txt!=null)e.textContent=txt;return e}
function kb(n){return !n?"":n>1048576?(n/1048576).toFixed(1)+" MB":Math.round(n/1024)+" KB"}
function isImg(f){return /^image\//.test(f.tipo||"")||/\.(jpe?g|png|webp|gif)$/i.test(f.nombre||"")}
function fecha(ms){return ms?new Date(ms).toLocaleString("es-PA",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):""}
// estructura: raíz › carpeta día (o Posts) › grupo › pieza › Vieja / Nueva
function diaLabel(d){return d.replace(/^\d{4}-\d{2}-\d{2} · /,"")}
function rootOf(it){return it.dia}
function build(){var R={};ITEMS.forEach(function(it){var a=rootOf(it),g=it.grupo.indexOf("Posts @gruporapid")===0?"Posts @gruporapid con isotipo":it.grupo;
  ((R[a]=R[a]||{})[g]=R[a][g]||[]).push(it)});return R}
function parse(){var raw=location.hash.slice(1);if(!raw)return{};var h=decodeURIComponent(raw);
  if(h.indexOf("doc|")===0)return{doc:h.slice(4)};
  if(h.indexOf("k|")===0){var p=h.split("|"),key=p.slice(1,p.length-1).join("|"),f=p[p.length-1];var it=ITEMS.find(function(x){return x.key===key});if(it)return{dia:rootOf(it),grupo:grupoOf(it),key:key,f:f};return{}}
  var q=raw.split("/").map(function(x){return decodeURIComponent(x)});return{dia:q[0]||null,grupo:q[1]||null,key:q[2]||null,f:q[3]||null}}
function grupoOf(it){return it.grupo.indexOf("Posts @gruporapid")===0?"Posts @gruporapid con isotipo":it.grupo}
function go(d,g,k,f){var parts=[d,g,k,f].filter(function(x){return x!=null&&x!==""});location.hash=parts.map(function(x){return encodeURIComponent(x)}).join("/")}
function piezaNombre(it){return it.grupo.indexOf("Posts @gruporapid")===0?it.grupo.split(" · ").slice(1).join(" · ")+" · "+it.nombre:it.nombre}
function fileCard(f,url,tag,tagcls,sub){var b=el("button",{"class":"file",type:"button"});var th=el("div",{"class":"th"});
  if(isImg(f))th.append(el("img",{src:url,loading:"lazy",alt:""}));else{var v=el("video",{src:url+"#t=1",preload:"metadata",muted:""});v.muted=true;th.append(v)}
  th.append(el("span",{"class":"tag "+tagcls},tag));var ft=el("div",{"class":"ft"});ft.append(el("b",null,f.nombre),el("small",null,sub));b.append(th,ft);
  b.onclick=function(){preview(f,url)};return b}
function preview(f,url){$("#pvt").textContent=f.nombre;$("#pvd").href=url+(url.indexOf("?")>-1?"&":"?")+"dl=1";var B=$("#pvb");B.innerHTML="";
  if(isImg(f))B.append(el("img",{src:url}));else{var v=el("video",{src:url,controls:""});v.controls=true;v.autoplay=true;B.append(v)}$("#pv").classList.add("on")}
function closePv(){var v=document.querySelector("#pvb video");if(v)v.pause();$("#pvb").innerHTML="";$("#pv").classList.remove("on")}
$("#pvx").onclick=closePv;document.addEventListener("keydown",function(e){if(e.key==="Escape")closePv()});
function crumb(s){var c=$("#crumb");c.innerHTML="";var add=function(t,fn){var b=el("button",{type:"button"},t);b.onclick=fn;c.append(b)};var sep=function(){c.append(el("span",null,"›"))};
  add("📁 Drive de Mercadeo",function(){go()});if(s.doc!=null){sep();add(s.doc,function(){})}if(s.dia){sep();add(diaLabel(s.dia),function(){go(s.dia)})}if(s.grupo){sep();add(s.grupo,function(){go(s.dia,s.grupo)})}
  if(s.key){var it=ITEMS.find(function(x){return x.key===s.key});sep();add(it?piezaNombre(it):"Pieza",function(){go(s.dia,s.grupo,s.key)})}
  if(s.f){sep();add(s.f==="vieja"?"Vieja":"Nueva",function(){})}}
function tree(s,R){var t=$("#tree");t.innerHTML="";var b=el("button",{type:"button","class":!s.dia&&s.doc==null?"on":""},"🏠 Todo el Drive");b.onclick=function(){go()};t.append(b);
  var M=docCarpetas();Object.keys(M).sort().forEach(function(k){var x=el("button",{type:"button","class":s.doc===k?"on":""});x.append(el("span",null,"🗂"),el("span",null,k+" ("+M[k].length+")"));x.onclick=function(){location.hash=encodeURIComponent("doc|"+k)};t.append(x)});
  Object.keys(R).sort().forEach(function(d){var n=Object.values(R[d]).reduce(function(a,x){return a+x.length},0);var x=el("button",{type:"button","class":s.dia===d&&!s.grupo?"on":""});x.append(el("span",null,"📁"),el("span",null,diaLabel(d)+" ("+n+")"));x.onclick=function(){go(d)};t.append(x);
    if(s.dia===d)Object.keys(R[d]).sort().forEach(function(g){var y=el("button",{type:"button","class":"sub"+(s.grupo===g?" on":"")});y.append(el("span",null,"📂"),el("span",null,g));y.onclick=function(){go(d,g)};t.append(y)})})}
function folder(ic,name,sub,fn){var b=el("button",{"class":"fold",type:"button"});b.append(el("span",{"class":"ic"},ic));var tx=el("span",{"class":"tx"});tx.append(el("b",null,name),el("small",null,sub));b.append(tx);b.onclick=fn;return b}
function docCarpetas(){var M={};DOCS.forEach(function(d){(M[d.carpeta]=M[d.carpeta]||[]).push(d)});return M}
function docIcon(d){var n=(d.nombre||"").toLowerCase();return /\.pptx?$/.test(n)?"📊":/\.pdf$/.test(n)?"📕":/\.html?$/.test(n)?"🌐":/\.docx?$/.test(n)?"📝":/\.xlsx?$/.test(n)?"📗":/\.(mp4|mov)$/.test(n)?"🎬":/\.(png|jpe?g)$/.test(n)?"🖼":"📄"}
function openDoc(d){var u="/f/"+d.id,n=(d.nombre||"").toLowerCase();if(/\.(html?|pdf)$/.test(n))window.open(u,"_blank");else if(/\.(mp4|mov|png|jpe?g|webp)$/.test(n))preview(d,u);else location.href=u+"?dl=1"}
function renderDoc(s,C){var M=docCarpetas(),L=M[s.doc]||[];C.append(el("h4",null,L.length+" archivos"));var g=el("div",{"class":"grid"});
  L.forEach(function(d){g.append(folder(docIcon(d),d.nombre,kb(d.tam)+(/\.(html?|pdf)$/i.test(d.nombre)?" · se abre en otra pestaña":/\.(mp4|mov|png|jpe?g)$/i.test(d.nombre)?" · vista previa":" · descargar"),function(){openDoc(d)}))});C.append(g)}
function render(){var s=parse(),R=build(),C=$("#content");C.innerHTML="";crumb(s);tree(s,R);
  if(s.doc!=null){renderDoc(s,C);return}
  if(Q){var q=Q.toLowerCase(),hits=ITEMS.filter(function(it){return (it.nombre+" "+it.grupo+" "+(it.vieja?it.vieja.nombre:"")+" "+it.nuevas.map(function(a){return a.nombre}).join(" ")).toLowerCase().indexOf(q)>-1});
    C.append(el("h4",null,hits.length+" resultados"));var g=el("div",{"class":"grid"});hits.forEach(function(it){g.append(folder("📁",piezaNombre(it),it.grupo+" · "+EST[it.estado],function(){Q="";$("#q").value="";go(rootOf(it),grupoOf(it),it.key)}))});C.append(g);return}
  if(!s.dia){var M=docCarpetas();if(Object.keys(M).length){C.append(el("h4",null,"Planes y documentos"));var gd=el("div",{"class":"grid"});
      Object.keys(M).sort().forEach(function(k){gd.append(folder("🗂",k,M[k].length+" archivos",function(){location.hash=encodeURIComponent("doc|"+k)}))});C.append(gd)}
    C.append(el("h4",null,"Piezas por día de entrega"));var g=el("div",{"class":"grid"});Object.keys(R).sort().forEach(function(d){var n=Object.values(R[d]).reduce(function(a,x){return a+x.length},0);
    var ok=Object.values(R[d]).reduce(function(a,x){return a+x.filter(function(i){return i.estado==="ok"}).length},0);g.append(folder("📁",diaLabel(d),n+" piezas · "+ok+" aprobadas",function(){go(d)}))});C.append(g);return}
  if(!s.grupo){var G=R[s.dia]||{};C.append(el("h4",null,"Carpetas"));var g=el("div",{"class":"grid"});Object.keys(G).sort().forEach(function(k){g.append(folder("📂",k,G[k].length+" piezas",function(){go(s.dia,k)}))});C.append(g);return}
  if(!s.key){var L=(R[s.dia]||{})[s.grupo]||[];C.append(el("h4",null,"Piezas"));var g=el("div",{"class":"grid"});L.forEach(function(it){g.append(folder(it.estado==="ok"?"✅":it.estado==="cambios"?"🟥":"📁",piezaNombre(it),EST[it.estado]+" · "+(it.nuevas.length?it.nuevas.length+" nueva(s)":"sin nueva"),function(){go(s.dia,s.grupo,it.key)}))});C.append(g);return}
  var it=ITEMS.find(function(x){return x.key===s.key});if(!it){C.append(el("div",{"class":"empty"},"No se encontró la pieza."));return}
  if(!s.f){C.append(el("h4",null,"Carpetas"));var g=el("div",{"class":"grid"});
    g.append(folder("🗂","Vieja",it.vieja?"1 archivo · versión anterior":"vacía",function(){go(s.dia,s.grupo,s.key,"vieja")}));
    g.append(folder(it.estado==="ok"?"✅":"🆕","Nueva",(it.nuevas.length||"0")+" archivo(s) · "+EST[it.estado],function(){go(s.dia,s.grupo,s.key,"nueva")}));C.append(g);
    var a=el("a",{href:"/anuncios"},"🎬 Aprobar o dar feedback en la revisión");a.style.color="var(--acc)";C.append(a);return}
  C.append(el("h4",null,s.f==="vieja"?"Versión anterior":"Versiones nuevas (la última es la vigente)"));var g=el("div",{"class":"grid"});
  if(s.f==="vieja"){if(it.vieja)g.append(fileCard(it.vieja,"/f/o/"+it.vieja.id,"Vieja","vieja",kb(it.vieja.tam)));else C.append(el("div",{"class":"empty"},"Esta pieza no tiene versión anterior cargada."))}
  else{if(!it.nuevas.length)C.append(el("div",{"class":"empty"},"Todavía no hay versión nueva. Se sube desde la revisión."));
    it.nuevas.forEach(function(a,i){var last=i===it.nuevas.length-1;g.append(fileCard(a,"/f/"+a.id,last?(it.estado==="ok"?"Aprobada":EST[it.estado]):"v"+(i+1)+" anterior",last?it.estado:"vieja","v"+(i+1)+" · "+kb(a.tam)+" · "+fecha(a.at)))})}
  C.append(g)}
$("#q").oninput=function(){Q=this.value.trim();render()};
window.addEventListener("hashchange",render);
function load(){fetch("/api/docs",{credentials:"same-origin"}).then(function(r){return r.ok?r.json():{docs:[]}}).then(function(x){DOCS=x.docs||[]}).catch(function(){}).then(function(){return fetch("/api/drive/arbol",{credentials:"same-origin"})}).then(function(r){if(r.status===401){location.reload();throw 0}return r.json()}).then(function(x){ITEMS=x.items||[];if(!document.querySelector("#pv.on"))render()}).catch(function(){})}
load();setInterval(load,30000);
})();
</script>
</body></html>
